# Build, sign and release USAGE Miner.
#
# Complete as far as it can be without SignPath credentials. It runs only when
# started by hand, and the signing steps are skipped unless `sign` is requested
# and `SIGNPATH_API_TOKEN` exists -- so it can be exercised today and produce
# exactly what a local build produces: an honest unsigned artifact.
#
# THE ORDER MATTERS, and is the reason this file exists rather than a script:
#
#   test -> build -> package -> upload artifact -> SIGN -> verify -> checksum
#
# Signing happens BEFORE the checksums that get published, because an
# Authenticode signature is appended to the PE and changes every byte after it.
# A checksum taken before signing describes a file nobody will ever download.
# And nothing modifies a signed binary afterwards -- no re-packing, no resource
# edit, no icon fix -- because any of those silently invalidate the signature.
#
# FAIL CLOSED. If signing was requested and the result does not verify, the job
# fails and publishes nothing. A release that says "signed" while carrying an
# unsigned or broken binary is worse than one that says nothing at all.
#
# BEFORE THIS CAN SIGN, all human decisions:
#   1. Move `miner/` to the public USAGE-Miner repository (docs/MINER-OSS.md).
#      SignPath verifies the repository, commit and workflow that produced an
#      artifact; a locally built EXE cannot be submitted, by design.
#   2. Apply to SignPath Foundation and be accepted. The Apache-2.0 licence is
#      in place; acceptance also needs MFA on GitHub and a published
#      code-signing policy page.
#   3. Install the SignPath GitHub App; create the project, signing policy and
#      artifact configuration named below.
#   4. Add SIGNPATH_API_TOKEN as a secret and SIGNPATH_ORGANIZATION_ID as a
#      repository variable.
#
# The executable signing identity is SEPARATE from the Proof of Usage receipt
# key and must stay separate. A compromised signing certificate means bad
# binaries; a compromised receipt key means fabricated proofs. Neither may ever
# stand in for the other, and neither is ever present in this workflow.

name: Release USAGE Miner

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Submit the build to SignPath (requires SIGNPATH_API_TOKEN)"
        type: boolean
        default: false
      publish:
        description: "Create a draft GitHub release with the artifacts"
        type: boolean
        default: false

permissions:
  contents: write
  # SignPath reads build provenance from GitHub, not from the build script, so
  # a build cannot lie about where it came from.
  id-token: write

jobs:
  build:
    # GitHub-hosted, and Windows: SignPath requires every job leading to a
    # signing request to run on their agents, not a self-hosted runner.
    runs-on: windows-latest

    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          # Pinned: the artifact literally contains this runtime, so the Node
          # version is part of what its checksum means.
          node-version: "24.13.1"

      - name: Install pinned dependencies
        working-directory: miner
        run: npm ci

      - name: Test
        working-directory: miner
        run: |
          npm run typecheck
          npm test

      - name: Build and package
        working-directory: miner
        run: npm run package

      - name: Checksums before signing
        id: unsigned
        working-directory: miner/dist/artifacts
        shell: bash
        run: |
          echo "These describe the UNSIGNED build and are not published."
          cat SHA256SUMS.txt

      # Stored before signing: SignPath will only sign an artifact it can see
      # GitHub received from this workflow.
      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: usage-miner-unsigned
          path: miner/dist/artifacts/
          if-no-files-found: error

      # ------------------------------------------------------------- signing

      - name: Submit to SignPath
        id: signpath
        if: ${{ inputs.sign && secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: usage-miner
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-executables
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: miner/dist/signed

      # The check that makes "signed" mean something. A signature that does not
      # verify, or verifies to the wrong publisher, stops the release here.
      - name: Verify Authenticode
        if: ${{ inputs.sign && secrets.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ vars.SIGNPATH_EXPECTED_PUBLISHER }}
        run: |
          $failed = $false
          Get-ChildItem miner/dist/signed -Filter *.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Output "$($_.Name): $($sig.Status) — $($sig.SignerCertificate.Subject)"

            if ($sig.Status -ne 'Valid') {
              Write-Output "::error::$($_.Name) is not validly signed ($($sig.Status))"
              $failed = $true
            }
            # Identity, not just validity: a valid signature from an
            # unexpected publisher is a supply-chain incident, not a pass.
            elseif ($env:EXPECTED_PUBLISHER -and
                    $sig.SignerCertificate.Subject -notlike "*$env:EXPECTED_PUBLISHER*") {
              Write-Output "::error::$($_.Name) signed by an unexpected publisher"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # Recomputed over the SIGNED bytes -- the ones people actually download.
      - name: Checksums after signing
        if: ${{ inputs.sign && secrets.SIGNPATH_API_TOKEN != '' }}
        shell: bash
        working-directory: miner/dist/signed
        run: |
          sha256sum *.exe | tee SHA256SUMS.txt

      - name: Upload signed artifact
        if: ${{ inputs.sign && secrets.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: usage-miner-signed
          path: miner/dist/signed/
          if-no-files-found: error

      # ------------------------------------------------------------ release

      # Draft, never published automatically. Attaching binaries to a public
      # release is an outward-facing act, and it stays a decision a person makes
      # after comparing checksums against their own rebuild.
      #
      # An unsigned build can still be released -- that is what v0.2.0-beta.1
      # was -- but it is labelled prerelease and the notes say so. What must
      # never happen is an unsigned artifact published as though it were signed,
      # which is why the source directory is chosen by whether signing ran.
      - name: Create draft release
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ inputs.sign && secrets.SIGNPATH_API_TOKEN != '' }}
        run: |
          $dir = if ($env:SIGNED -eq 'true') { 'miner/dist/signed' } else { 'miner/dist/artifacts' }
          $label = if ($env:SIGNED -eq 'true') { 'signed' } else { 'UNSIGNED' }
          $version = (Get-Content miner/package.json | ConvertFrom-Json).version

          gh release create "v$version" `
            --draft --prerelease `
            --title "USAGE Miner $version ($label)" `
            --notes "Built from $env:GITHUB_SHA by $env:GITHUB_WORKFLOW. Artifacts are $label. Verify the SHA-256 before running." `
            (Get-ChildItem $dir | ForEach-Object { $_.FullName })
